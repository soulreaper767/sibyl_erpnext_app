{#- Sibyl email title (overrides frappe/templates/emails/email_header.html) -#}
{%- set dot = {"green": "#1a7f37", "red": "#b42318", "orange": "#c4660b", "yellow": "#b98900", "blue": "#2e64c4", "gray": "#98a2b3", "grey": "#98a2b3"} -%}
<table class="sx-header" border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse:collapse;">
	<tr>
		<td style="font-family:'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size:18px; font-weight:700; line-height:1.35; color:#14213d;">
			{% if indicator %}<span style="display:inline-block; width:9px; height:9px; border-radius:50%; background:{{ dot.get(indicator, '#14213d') }}; margin-right:8px; vertical-align:middle;"></span>{% endif %}<span style="vertical-align:middle;">{{ header_title }}</span>
		</td>
	</tr>
</table>
